services:
  proxy:
    build: ./proxy
    image: hri210443/reverse-proxy:1.0.0
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - appnet
    ports:
      - "80:80"
      - "443:443"
    restart: on-failure

  frontend:
    build: ./frontend
    image: hri210443/angular-client:1.0.0
    depends_on:
      backend:
        condition: service_started
    networks:
      - appnet
    restart: on-failure

  backend:
    build: ./backend
    image: hri210443/spring-fhir-api:1.0.0
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - appnet
    expose:
      - "8080"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spengerfhirmed
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - appnet
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 2s
      timeout: 25s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=mysql
      - KC_DB_URL=jdbc:mysql://db:3306/keycloak
      - KC_DB_USERNAME=root
      - KC_DB_PASSWORD=root
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HOSTNAME_URL=https://localhost
      - KC_HOSTNAME_ADMIN_URL=https://localhost
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_PROXY=edge
      - KC_PROXY_ADDRESS_FORWARDING=true
    command:
      - start-dev
      - --import-realm
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - appnet
    expose:
      - "8080"
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

volumes:
  db_data:

networks:
  appnet:
    driver: bridge