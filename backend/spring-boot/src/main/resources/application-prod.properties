server.address=0.0.0.0
server.port=8080
server.ssl.enabled=false

# Security debugging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.at.spengergasse.spengermed=DEBUG

# Request/Response logging
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
spring.mvc.log-request-details=true

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost/realms/spengermed
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/spengermed/protocol/openid-connect/certs

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true