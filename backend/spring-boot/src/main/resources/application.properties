spring.application.name=spengerfhirmed

spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://db:3306/spengerfhirmed
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore/spengerfhirmed.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=spengermed
server.ssl.enabled=false
server.port=8080
spring.sql.init.mode= always

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://localhost/realms/spengermed
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/spengermed/protocol/openid-connect/certs

app.security.require-auth=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
